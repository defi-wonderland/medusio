version: '3.8'

services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-medusa:latest
    container_name: n8n-medusa
    restart: always
    environment:
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  n8n_data:
  caddy_data: